name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fails if gradle-wrapper.jar isn't an official Gradle release.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          # scripts/build.sh needs these; Gradle downloads what compileSdk needs itself.
          "$SDKM" "build-tools;35.0.0" "platforms;android-35" > /dev/null
          "$SDKM" --list 2>/dev/null | grep -E "platforms;android-3[6-9]" || true

      - name: Build with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build with scripts/build.sh (no Gradle)
        run: scripts/build.sh

      - name: Verify both APKs
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          for apk in app/build/outputs/apk/debug/app-debug.apk PushGuard.apk; do
            echo "== $apk"
            "$BT/aapt2" dump badging "$apk" > badging.txt
            grep -E "^package:|targetSdkVersion|application-icon-" badging.txt | head -5
            grep -q "^package: name='dev.pushguard'" badging.txt
            grep -q "targetSdkVersion:'22'" badging.txt
            grep -q "application-icon-" badging.txt
            "$BT/apksigner" verify "$apk"
            for c in Guard GuardService MainActivity Receiver; do
              "$BT/dexdump" "$apk" 2>/dev/null | grep -q "Ldev/pushguard/$c;" \
                || { echo "missing class $c in $apk"; exit 1; }
            done
            # Permissions, components and intent filters, for comparing the two builds.
            "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$apk" \
              | grep -E "^ *E: (uses-permission|activity|service|receiver|action|category)|A: .*android:(name|exported|foregroundServiceType)" \
              | sed -E 's/ *\(line=[0-9]+\)//; s/\(0x[0-9a-f]+\)//' > "$(basename "$apk").manifest.txt"
            echo "OK: $apk"
          done
          echo "== Manifest differences between the Gradle and build.sh APKs (should be none):"
          diff app-debug.apk.manifest.txt PushGuard.apk.manifest.txt && echo "none"
          cat PushGuard.apk.manifest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            PushGuard.apk
